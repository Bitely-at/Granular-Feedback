[build]
  command = "npm run build"
  publish = "dist"

# Diese Site laeuft unter app.bitely.at. bitely.at selbst gehoert seit dem
# Domain-Umzug direkt der Landingpage-Site (bitely-demo-site, Repo
# bitely-landing) — sie wird nicht mehr von hier per Proxy geholt.
#
# Frueher standen hier drei Regeln, die /, /_next/* und /images/* an die
# Landingpage weitergereicht haben. Die sind ersatzlos weg. Das Gegenstueck
# dazu liegt jetzt in der netlify.toml der Landingpage: dort fangen 301er die
# alten bitely.at-Pfade gedruckter QR-Codes ab und schicken sie hierher.

# Die App ist eine SPA: /:orgSlug/admin, /:orgSlug/staff und vor allem die
# QR-Code-Route /:orgSlug/:branchSlug/table/:nummer loest react-router
# clientseitig auf. Jeder Pfad muss deshalb auf index.html zeigen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sicherheits-Header für jede Seite der App.
# - Einbetten in fremde Seiten verboten (Clickjacking auf Einlöse-Wisch und
#   Verwaltung). Die Landingpage bettet die App nicht ein.
# - Referrer nur als Ursprung: die Tisch-URL (/<org>/<filiale>/table/<nr>)
#   soll nicht vollständig an Google Maps oder andere Links weitergehen.
# - Kamera nur für die eigene Seite (Bon-Scan), Mikrofon und Standort nie.
# Eine volle Content-Security-Policy fehlt bewusst noch: Google-Anmeldung,
# Bilder von beliebigen Adressen und die API-Adresse aus der Buildzeit müssten
# dafür erst sauber aufgelistet werden.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
