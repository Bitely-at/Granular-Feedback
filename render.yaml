services:
  - type: web
    name: bitely-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      # Signiert die Login-Tokens. Render erzeugt beim ersten Deploy einen
      # zufälligen Wert — ohne ihn startet der Server nicht (siehe auth.ts).
      # Wird er später geändert, sind alle offenen Sitzungen ungültig.
      - key: JWT_SECRET
        generateValue: true
      # GOOGLE_CLIENT_ID (Google-Anmeldung für Gäste) steht bewusst NICHT hier,
      # sondern nur im Render-Dashboard: eine neu hinzugefügte Variable mit
      # `sync: false` hält den Blueprint-Abgleich an, bis jemand den Wert von
      # Hand bestätigt — und solange geht kein Deploy mehr durch. Genau das ist
      # einmal passiert. Optionale Werte gehören ins Dashboard.
      - key: PORT
        value: 4000
